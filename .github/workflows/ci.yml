name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: finance_test_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_test -d finance_test_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python dependencies
        run: python -m pip check

      - name: Run Python regression suite
        env:
          FINANCE_TEST_POSTGRES_ADMIN_DSN: postgresql://finance_test:synthetic-ci-only@127.0.0.1:5432/finance_test_admin?sslmode=disable
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m py_compile privacy_notice.py app.py webapp.py wsgi.py production.py simple_cashflow.py profile_settings.py recommendations.py tools/local_review_sandbox.py tests/test_app.py

      - name: Check frontend JavaScript syntax
        run: node --check static/app.js

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify monthly overview behavior
        run: node --test tests/monthly_overview.test.cjs

      - name: Verify isolated local review proxy
        env:
          PYTHON_BIN: python
        run: node --test tests/local_review_proxy.test.mjs

      - name: Run browser end-to-end tests
        run: npm run test:e2e
